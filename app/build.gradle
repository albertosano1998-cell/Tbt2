plugins { id 'com.android.application' }

android {
    namespace 'com.tbt2.gamerecorder'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tbt2.gamerecorder'
        minSdk 26
        targetSdk 30
        versionCode 1
        versionName '1.0.0'
    }
}

dependencies {
    implementation 'androidx.media3:media3-transformer:1.8.0'
    implementation 'androidx.media3:media3-common:1.8.0'
}
